name: CryptoCraft
version: '${version}'
main: de.cryptocraft.CryptoCraftPlugin
api-version: '26.3'
description: Shows cryptocurrency prices on placeable boards.
authors: [CryptoCraft]
softdepend: [WorldGuard, PlaceholderAPI]

commands:
  crypto:
    description: Manage cryptocurrency price boards.
    usage: /crypto <place|remove|list|price|tp|edit|menu|watch|compare|alert|signal|portfolio|status|reload>
    aliases: [cryptocraft]

permissions:
  cryptocraft.use:
    description: Allows use of CryptoCraft commands.
    default: true
  cryptocraft.place:
    description: Allows placing price boards.
    default: true
  cryptocraft.limit.unlimited:
    description: Removes the limit on price boards.
    default: op
  cryptocraft.limit.vip:
    description: Uses the VIP board limit configured in config.yml.
    default: false
  cryptocraft.limit.elite:
    description: Uses the Elite board limit configured in config.yml.
    default: false
  cryptocraft.admin:
    description: Erlaubt die Verwaltung und hebt das Anzeigelimit auf.
    default: op
  cryptocraft.teleport:
    description: Allows teleporting to CryptoCraft boards.
    default: op
  cryptocraft.edit:
    description: Allows editing owned boards.
    default: true
  cryptocraft.alert:
    description: Allows price alerts.
    default: true
  cryptocraft.signal:
    description: Allows linking owned boards to an existing lever.
    default: op
  cryptocraft.portfolio:
    description: Allows virtual paper trading when enabled in config.yml.
    default: true
