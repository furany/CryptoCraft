# Price polling. All active boards share a single request per refresh.
prices:
  # Automatic refresh interval. 300 seconds = 5 minutes.
  refresh-interval-seconds: 300
  # Global minimum delay between requests, including refreshes triggered by commands.
  minimum-request-interval-seconds: 60
  request-timeout-seconds: 20
  # Show an old-price marker on charts after this long without a fresh quote.
  stale-after-minutes: 10
  # Keep sampled prices for this many days so boards can draw history charts.
  history-retention-days: 7
  # Optional initial history import. Shares the global request floor and backoff.
  backfill:
    enabled: false
    days: 7
    maximum-requests-per-hour: 6
    # Leave empty for CoinGecko. A custom compatible provider must set this explicitly.
    url: ""
  retry:
    initial-delay-seconds: 60
    maximum-delay-seconds: 3600
    # Authentication or IP denials are less likely to clear quickly than rate limits.
    access-error-initial-delay-seconds: 900
    access-error-maximum-delay-seconds: 3600

boards:
  # Number of boards allowed per player without a special permission.
  default-limit-per-player: 1
  # Admins may place unlimited boards when they have the admin permission.
  admin-bypass-limit: true
  admin-permission: cryptocraft.admin
  unlimited-permission: cryptocraft.limit.unlimited
  # LuckPerms nodes and their board limits. If several match, the highest limit applies.
  permission-limits:
    cryptocraft.limit.vip: 3
    cryptocraft.limit.elite: 5
  display-height: 1.35
  # Time window drawn on each chart. Stored samples are shared by boards for the same pair.
  chart-history-hours: 24

api:
  # CoinGecko Simple Price API or a compatible endpoint.
  url: "https://api.coingecko.com/api/v3/simple/price"
  # Choose "demo" or "pro". Pro mode switches the default endpoint to pro-api.coingecko.com.
  auth-mode: demo
  # Optional. Leave empty to use CoinGecko's keyless Public API.
  demo-key: ""
  # Required when auth-mode is "pro".
  pro-key: ""
  query:
    coin-ids-parameter: ids
    currencies-parameter: vs_currencies
    include-24hr-change: true
    include-last-updated-at: true
    # Extra query parameters for compatible API proxies, e.g. parameter-name: "value"
    additional-parameters: {}

coins:
  BTC: bitcoin
  ETH: ethereum
  SOL: solana

currencies:
  - EUR
  - USD
  - TRY

# Currency used when a command omits its optional currency argument.
default-currency: EUR

# Per-player features are persisted in players.yml.
players:
  watchlist-limit: 20
  alarm-limit: 20
  alarm-cooldown-seconds: 300
  # Signals use an existing lever directly above a board's anchor.
  redstone-enabled: true

# Paper trading with virtual cash, independent of real wallets and Vault.
portfolio:
  enabled: false
  currency: EUR
  starting-cash: "10000"

integrations:
  worldguard: true
  placeholderapi: true
  # Request all configured pairs for scoreboards even when no board/watchlist exists.
  placeholderapi-preload: false
